<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Своя кухня — доставка еды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1D1D1F;         /* near-black text, Apple-style */
    --ink-soft: #6E6E73;    /* secondary gray text */
    --bg: #FFFFFF;
    --surface: #F5F5F7;     /* light gray surface */
    --surface-dim: #EDEDF0;
    --accent: #C99A3C;      /* warm gold from the logo — the one accent color */
    --accent-light: #E6C570;
    --leaf: #1D1D1F;        /* remapped: "leaf" now means primary ink/black for buttons */
    --leaf-dark: #000000;
    --lacquer: #C0392B;     /* reserved for errors / destructive states only */
    --paper: #FFFFFF;
    --paper-dim: #F5F5F7;
    --line: rgba(0,0,0,0.08);
    --shadow-soft: 0 10px 24px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Be Vietnam Pro', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .font-display{ font-family:'Fraunces', serif; }
  svg{ display:block; }

  /* ---------- Splash ---------- */
  #splash{
    position:fixed; inset:0; z-index:999;
    background:#000000;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transition:opacity .55s ease, visibility .55s ease;
    overflow:hidden;
  }
  #splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  #splash .steam-field{ position:absolute; inset:0; opacity:.4; }
  #splash .steam-field path{
    stroke:var(--accent-light); stroke-width:1.4; fill:none; opacity:0;
    stroke-dasharray:120; stroke-dashoffset:120;
    animation: steamRise 3.2s ease-in-out infinite;
  }
  #splash .steam-field path:nth-child(2){ animation-delay:.5s; }
  #splash .steam-field path:nth-child(3){ animation-delay:1.1s; }
  @keyframes steamRise{
    0%{ opacity:0; stroke-dashoffset:120; transform:translateY(0); }
    15%{ opacity:.6; }
    70%{ opacity:.25; }
    100%{ opacity:0; stroke-dashoffset:0; transform:translateY(-26px); }
  }

  #splash .logo-wrap{
    position:relative; width:150px; height:150px; border-radius:50%;
    box-shadow:0 18px 44px rgba(0,0,0,0.5);
    animation: logoPop .8s cubic-bezier(.2,.9,.25,1.1) both, logoFloat 3.4s ease-in-out .8s infinite;
  }
  #splash .logo-wrap img{ width:100%; height:100%; border-radius:50%; display:block; }
  #splash .logo-ring{
    position:absolute; inset:-8px; border-radius:50%;
    border:1.5px solid rgba(230,197,112,0.55);
    animation: ringPulse 2.4s ease-out infinite;
  }
  @keyframes logoPop{
    0%{ opacity:0; transform:scale(.72); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes logoFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
  }
  @keyframes ringPulse{
    0%{ transform:scale(1); opacity:.9; }
    100%{ transform:scale(1.38); opacity:0; }
  }
  #splash .splash-text{
    color:#fff; margin-top:22px; font-size:13px; letter-spacing:.22em; opacity:0;
    animation: fadeUp .6s ease .5s forwards;
  }
  #splash .splash-sub{
    color:var(--accent-light); margin-top:6px; font-size:11.5px; letter-spacing:.05em; opacity:0;
    animation: fadeUp .6s ease .7s forwards;
  }
  @keyframes fadeUp{
    0%{ opacity:0; transform:translateY(8px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Header ---------- */
  header.app-header{
    background:#FFFFFF; color:var(--ink); padding:20px 18px 16px;
    border-bottom:1px solid var(--line);
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:14px;
  }
  header .header-logo{
    width:50px; height:50px; border-radius:50%; flex-shrink:0; position:relative;
    box-shadow:0 4px 14px rgba(0,0,0,0.12);
  }
  header .header-logo img{ width:100%; height:100%; border-radius:50%; display:block; }
  header .header-text{ position:relative; min-width:0; }
  header .brand-title{ font-size:22px; font-weight:700; letter-spacing:.01em; color:var(--ink); }
  header .brand-slogan{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  header .brand-hours{ font-size:11px; color:var(--accent); margin-top:8px; font-weight:600; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:6px; padding:14px 16px 0; position:relative; }
  .tab-btn{
    flex:1; text-align:center; padding:9px 6px; font-size:13px; font-weight:600;
    border-radius:12px; background:var(--surface); color:var(--ink-soft); border:1px solid transparent;
    transition:background .25s ease, color .25s ease, transform .15s ease;
  }
  .tab-btn:active{ transform:scale(.96); }
  .tab-btn.active{ background:var(--ink); color:#fff; box-shadow:var(--shadow-soft); }

  /* ---------- Grid / Cards ---------- */
  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
  .card{
    background:#fff; border-radius:16px; overflow:hidden; border:1px solid var(--line);
    opacity:0; transform:translateY(14px); box-shadow:0 3px 10px rgba(35,43,20,0.06);
    animation: cardIn .5s cubic-bezier(.2,.8,.3,1) forwards;
    transition:box-shadow .25s ease, transform .25s ease;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .card .img-wrap{ position:relative; aspect-ratio:1/0.8; overflow:hidden; background:var(--paper-dim); }
  .card .img-wrap img{ width:100%; height:100%; object-fit:cover; transition:transform .4s cubic-bezier(.2,.8,.3,1); }
  .card:active .img-wrap img{ transform:scale(1.07); }
  .card .fav-btn{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.92); display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .card .fav-btn:active{ transform:scale(.85); }
  .card .fav-btn svg{ transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  .card .fav-btn.just-fav svg{ animation:favPop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes favPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  .card .stock-badge{
    position:absolute; left:8px; top:8px; font-size:10px; padding:4px 9px 4px 7px; border-radius:999px;
    background:rgba(29,29,31,0.82); color:#fff; display:flex; align-items:center; gap:4px;
    backdrop-filter:blur(2px);
  }
  .card .stock-badge svg{ width:10px; height:10px; flex-shrink:0; }
  .card .stock-badge.out{ background:rgba(168,52,42,0.92); }
  .card .body{ padding:10px 10px 12px; }
  .card .name{ font-weight:600; font-size:13.5px; line-height:1.25; }
  .card .desc{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; height:28px; overflow:hidden; }
  .card .price{ font-family:'Fraunces',serif; font-weight:700; color:var(--ink); font-size:14.5px; margin-top:6px; }
  .card .add-row{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; gap:6px; }
  .qty-pill{ display:flex; align-items:center; gap:6px; background:var(--surface); border-radius:999px; padding:3px; }
  .qty-pill button{
    width:24px; height:24px; border-radius:50%; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; transition:transform .15s ease, background .2s ease;
  }
  .qty-pill button:active{ transform:scale(.82); background:#000; }
  .qty-pill button svg{ width:11px; height:11px; }
  .qty-pill span{ min-width:14px; text-align:center; font-size:13px; font-weight:600; }

  .add-btn{
    background:linear-gradient(155deg, var(--accent-light) 0%, var(--accent) 100%);
    color:#1D1D1F; font-size:12px; font-weight:700;
    padding:8px 13px; border-radius:999px; display:inline-flex; align-items:center; gap:5px;
    box-shadow:0 4px 10px rgba(201,154,60,0.4);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, filter .2s ease;
  }
  .add-btn svg{ width:13px; height:13px; }
  .add-btn:active{ transform:scale(.92); box-shadow:0 2px 5px rgba(201,154,60,0.35); }
  .add-btn:disabled{
    background:#ddd6c4; color:#9a9a8c; box-shadow:none; transform:none;
  }
  .add-btn.just-added{ animation:addPulse .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes addPulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.14); filter:brightness(1.1); }
    100%{ transform:scale(1); }
  }

  /* ---------- Floating cart ---------- */
  #cartFab{
    position:fixed; width:58px; height:58px; border-radius:50%; background:var(--ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,0.3);
    z-index:60; touch-action:none; color:#fff;
  }
  #cartFab .badge{
    position:absolute; top:-4px; right:-4px; background:var(--accent); color:#1D1D1F;
    font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  #cartFab{ transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
  #cartFab.bump{ animation:cartBump .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cartBump{
    0%{ transform:scale(1) rotate(0); }
    30%{ transform:scale(1.18) rotate(-6deg); }
    60%{ transform:scale(.96) rotate(4deg); }
    100%{ transform:scale(1) rotate(0); }
  }

  /* ---------- Modal / sheets ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:80;
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s ease;
    backdrop-filter:blur(2px);
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:#fff; width:100%; max-height:88vh; overflow-y:auto;
    border-top-left-radius:22px; border-top-right-radius:22px; padding:18px;
    transform:translateY(24px); transition:transform .3s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 -8px 30px rgba(0,0,0,0.15);
  }
  .sheet-overlay.open .sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; background:var(--surface-dim); border-radius:99px; margin:0 auto 14px; }

  input, textarea{
    width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); font-size:14px; font-family:inherit; color:var(--ink);
    transition:border-color .2s ease, background .2s ease;
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--ink); background:#fff; }
  label.field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:12px 0 5px; display:block; text-transform:uppercase; letter-spacing:.04em; }

  .primary-btn{
    width:100%; background:var(--ink); color:#fff; font-weight:700; font-size:15px;
    padding:14px; border-radius:14px; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease;
    box-shadow:0 6px 16px rgba(0,0,0,0.16);
  }
  .primary-btn:active{ transform:scale(.98); }
  .primary-btn:disabled{ background:var(--surface-dim); color:var(--ink-soft); box-shadow:none; transform:none; }
  .secondary-btn{
    width:100%; background:#fff; color:var(--ink); font-weight:600; font-size:13px;
    padding:10px; border-radius:12px; border:1px solid var(--line); margin-top:8px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .secondary-btn:active{ transform:scale(.97); background:var(--surface); }
  .secondary-btn svg{ width:15px; height:15px; flex-shrink:0; }

  .empty-state{ text-align:center; padding:60px 24px; color:var(--ink-soft); }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px;
    font-size:13px; z-index:200; opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
</style>
</head>
<body>

<div id="splash">
  <svg class="steam-field" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M70 140 C 60 120, 80 110, 72 90 C 66 74, 82 66, 78 50"/>
    <path d="M100 145 C 90 122, 112 112, 104 92 C 97 74, 114 64, 110 46"/>
    <path d="M130 140 C 120 120, 140 110, 132 90 C 126 74, 142 66, 138 50"/>
  </svg>
  <div class="logo-wrap">
    <div class="logo-ring"></div>
    <img src="logo.png" alt="Своя кухня">
  </div>
  <div class="splash-text">СВОЯ КУХНЯ</div>
  <div class="splash-sub">доставка домашней еды</div>
</div>

<header class="app-header">
  <div class="header-logo"><img src="logo.png" alt="Своя кухня"></div>
  <div class="header-text">
    <div class="brand-title font-display">Своя кухня</div>
    <div class="brand-slogan">Доставка авторской домашней еды по Нячангу</div>
    <div class="brand-hours" id="hoursLine">ПН-ПТ: 11:00 – 20:00 · СБ-ВС: выходные</div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="day">Блюда дня</button>
  <button class="tab-btn" data-tab="fav">Избранное</button>
  <button class="tab-btn" data-tab="history">История</button>
</div>

<div id="menuGrid" class="menu-grid"></div>
<div id="emptyState" class="empty-state" style="display:none;"></div>

<!-- Floating draggable cart -->
<div id="cartFab">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.4" fill="white"/><circle cx="18" cy="21" r="1.4" fill="white"/></svg>
  <div class="badge" id="cartBadge" style="display:none;">0</div>
</div>

<!-- Item detail / addon modal -->
<div class="sheet-overlay" id="itemOverlay">
  <div class="sheet" id="itemSheet"></div>
</div>

<!-- Cart sheet -->
<div class="sheet-overlay" id="cartOverlay">
  <div class="sheet" id="cartSheet"></div>
</div>

<!-- Checkout sheet -->
<div class="sheet-overlay" id="checkoutOverlay">
  <div class="sheet" id="checkoutSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ICONS — inline SVG, no emoji anywhere
========================================================= */
const ICONS = {
  plus: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  minus: `<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  cartAdd: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.3" fill="currentColor"/><circle cx="18" cy="21" r="1.3" fill="currentColor"/><path d="M15 6v5M12.5 8.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  box: `<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  boxOff: `<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8.5 9 7 6M15.5 9l-7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>`,
  warning: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 21.5 20h-19L12 3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 9.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1" fill="currentColor"/></svg>`,
  errorCircle: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="m9 9 6 6M15 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
};


const API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

const DELIVERY_TIERS = [
  { upTo: 1,    fee: 30000 },
  { upTo: 2,    fee: 40000 },
  { upTo: 3,    fee: 45000 },
  { upTo: 5,    fee: 48000 },
  { upTo: Infinity, fee: 50000 }
];

/* =========================================================
   TELEGRAM SETUP
========================================================= */
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;

/* =========================================================
   STATE
========================================================= */
let state = {
  items: [],
  addons: {},
  restaurant: { lat: null, lng: null },
  favorites: [],
  cart: [],       // { id, name, price, qty, addon, addon_extra }
  history: [],
  activeTab: 'day',
  deliveryPoint: null // { lat, lng }
};

const CS_KEY_FAV = 'sk_favorites';
const CS_KEY_CART = 'sk_cart';

// CloudStorage requires Bot API 6.9+. Outside real Telegram (plain browser testing)
// or on older Telegram clients, calling it throws synchronously — always fall back
// to localStorage safely instead of letting that break app init.
function cloudStorageSupported(){
  try {
    return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  } catch(e){ return false; }
}
function csGet(key){
  return new Promise(resolve => {
    if (cloudStorageSupported()) {
      try {
        tg.CloudStorage.getItem(key, (err, value) => {
          if (err || !value) { resolve(null); return; }
          try { resolve(JSON.parse(value)); } catch(e){ resolve(null); }
        });
      } catch(e){
        try { resolve(JSON.parse(localStorage.getItem(key))); } catch(e2){ resolve(null); }
      }
    } else {
      try { resolve(JSON.parse(localStorage.getItem(key))); } catch(e){ resolve(null); }
    }
  });
}
function csSet(key, value){
  const str = JSON.stringify(value);
  if (cloudStorageSupported()) {
    try { tg.CloudStorage.setItem(key, str); }
    catch(e){ localStorage.setItem(key, str); }
  } else {
    localStorage.setItem(key, str);
  }
}

/* =========================================================
   API HELPERS
========================================================= */
async function apiGet(action, params={}){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  return res.json();
}
async function apiPost(action, payload){
  const res = await fetch(API_URL, {
    method:'POST',
    body: JSON.stringify({ action, payload })
  });
  return res.json();
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  try {
    state.favorites = (await csGet(CS_KEY_FAV)) || [];
    state.cart = (await csGet(CS_KEY_CART)) || [];

    try {
      const menuRes = await apiGet('getMenu');
      if (menuRes.ok) {
        state.items = menuRes.data.items;
        state.addons = menuRes.data.addons;
        state.restaurant = menuRes.data.restaurant;
        document.getElementById('hoursLine').textContent =
          `${menuRes.data.hours.weekday} · ${menuRes.data.hours.weekend}`;
      } else {
        showToast('Ошибка загрузки меню');
      }
    } catch(e){ console.error(e); showToast('Не удалось связаться с сервером'); }

    renderTab();
    updateCartBadge();
  } catch(e){
    console.error('init() failed:', e);
  } finally {
    // Always hide the splash, even if something above failed, so the app
    // is never stuck on a frozen loading screen.
    document.getElementById('splash').classList.add('hide');
  }
}

/* =========================================================
   TABS
========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activeTab = btn.dataset.tab;
    renderTab();
  });
});

async function renderTab(){
  const grid = document.getElementById('menuGrid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';

  let list = [];
  if (state.activeTab === 'day') {
    list = state.items.filter(i => i.is_day_dish === true || i.is_day_dish === 'TRUE');
  } else if (state.activeTab === 'fav') {
    list = state.items.filter(i => state.favorites.includes(String(i.id)));
  } else if (state.activeTab === 'history') {
    if (tgUser) {
      const histRes = await apiGet('getHistory', { user_id: tgUser.id });
      state.history = histRes.ok ? histRes.data : [];
    }
    renderHistory();
    return;
  }

  if (list.length === 0) {
    empty.style.display = 'block';
    empty.textContent = state.activeTab === 'fav'
      ? 'Пока нет избранных блюд — нажмите на сердечко на карточке блюда.'
      : 'Сегодня блюд дня не найдено.';
    return;
  }
  empty.style.display = 'none';
  list.forEach((item, idx) => grid.appendChild(renderCard(item, idx)));
}

function renderHistory(){
  const grid = document.getElementById('menuGrid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';
  if (state.history.length === 0) {
    empty.style.display = 'block';
    empty.textContent = 'У вас пока нет заказов.';
    return;
  }
  empty.style.display = 'none';
  grid.style.gridTemplateColumns = '1fr';
  state.history.forEach(order => {
    const items = JSON.parse(order.items_json || '[]');
    const card = document.createElement('div');
    card.className = 'card';
    card.style.padding = '12px';
    const date = new Date(order.timestamp).toLocaleDateString('ru-RU');
    const canReorder = items.every(it => {
      const menuItem = state.items.find(m => String(m.id) === String(it.id));
      return menuItem && Number(menuItem.stock) >= it.qty;
    });
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:700;">${order.order_id}</div>
        <div style="font-size:11px;color:var(--ink-soft);">${date}</div>
      </div>
      <div style="font-size:12.5px;color:#555;margin-top:6px;">
        ${items.map(it => `${it.name} × ${it.qty}`).join(', ')}
      </div>
      <div style="font-family:'Fraunces',serif;font-weight:700;color:var(--leaf);margin-top:8px;">
        ${Number(order.total).toLocaleString('ru-RU')} VND
      </div>
      <button class="add-btn" style="margin-top:8px;" ${canReorder ? '' : 'disabled'} data-reorder='${JSON.stringify(items).replace(/'/g,"&apos;")}'>
        ${canReorder ? 'Повторить заказ' : 'Товара нет в наличии'}
      </button>
    `;
    card.querySelector('button').addEventListener('click', (e) => {
      if (e.target.disabled) return;
      const items = JSON.parse(e.target.dataset.reorder);
      items.forEach(it => addToCart(it.id, it.qty, it.addon, it.addon_extra));
      showToast('Блюда добавлены в корзину');
    });
    grid.appendChild(card);
  });
}

function renderCard(item, idx){

  el.className = 'card';
  el.style.animationDelay = (idx * 0.04) + 's';
  const isFav = state.favorites.includes(String(item.id));
  const stock = Number(item.stock) || 0;
  const outOfStock = stock <= 0;

  el.innerHTML = `
    <div class="img-wrap" data-open="${item.id}">
      <img src="${item.image_url}" alt="${item.name}" loading="lazy">
      <div class="stock-badge ${outOfStock ? 'out' : ''}">${outOfStock ? ICONS.boxOff : ICONS.box}${outOfStock ? 'нет в наличии' : 'в наличии: ' + stock}</div>
      <div class="fav-btn" data-fav="${item.id}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="${isFav ? '#C0392B' : 'none'}" stroke="#C0392B" stroke-width="2">
          <path d="M12 21s-7.5-4.6-10-9.2C.5 8.1 2.4 4 6.3 4c2.1 0 3.7 1.2 4.7 2.9C11.9 5.2 13.5 4 15.7 4c3.9 0 5.8 4.1 4.3 7.8C19.5 16.4 12 21 12 21z"/>
        </svg>
      </div>
    </div>
    <div class="body">
      <div class="name" data-open="${item.id}">${item.name}</div>
      <div class="desc" data-open="${item.id}">${item.description || ''}</div>
      <div class="price">${Number(item.price).toLocaleString('ru-RU')} VND</div>
      <div class="add-row">
        <div class="qty-pill">
          <button data-qty-minus>${ICONS.minus}</button>
          <span data-qty-val>1</span>
          <button data-qty-plus>${ICONS.plus}</button>
        </div>
        <button class="add-btn" data-add="${item.id}" ${outOfStock ? 'disabled' : ''}>${ICONS.cartAdd}В корзину</button>
      </div>
    </div>
  `;

  let qty = 1;
  const qtyVal = el.querySelector('[data-qty-val]');
  el.querySelector('[data-qty-minus]').addEventListener('click', () => {
    qty = Math.max(1, qty - 1); qtyVal.textContent = qty;
  });
  el.querySelector('[data-qty-plus]').addEventListener('click', () => {
    qty = Math.min(stock || 99, qty + 1); qtyVal.textContent = qty;
  });
  el.querySelectorAll('[data-open]').forEach(n => n.addEventListener('click', () => openItemSheet(item)));
  el.querySelector('[data-fav]').addEventListener('click', () => toggleFavorite(item.id));
  const addBtn = el.querySelector('[data-add]');
  addBtn.addEventListener('click', () => {
    addBtn.classList.remove('just-added'); void addBtn.offsetWidth; addBtn.classList.add('just-added');
    if (item.addon_group && state.addons[item.addon_group]) {
      openItemSheet(item, qty);
    } else {
      addToCart(item.id, qty);
      showToast('Добавлено в корзину');
    }
  });

  return el;
}

/* =========================================================
   CART
========================================================= */
function addToCart(id, qty, addon=null, addonExtra=0){
  const item = state.items.find(i => String(i.id) === String(id));
  if (!item) return;
  const existing = state.cart.find(c => String(c.id) === String(id) && c.addon === addon);
  if (existing) { existing.qty += qty; }
  else {
    state.cart.push({
      id: item.id, name: item.name, price: Number(item.price), image_url: item.image_url,
      qty, addon, addon_extra: addonExtra || 0
    });
  }
  csSet(CS_KEY_CART, state.cart);
  updateCartBadge();
}

function updateCartBadge(){
  const count = state.cart.reduce((s,c) => s + c.qty, 0);
  const badge = document.getElementById('cartBadge');
  const fab = document.getElementById('cartFab');
  if (count > 0) { badge.style.display = 'flex'; badge.textContent = count; }
  else { badge.style.display = 'none'; }
  if (count > (updateCartBadge._last || 0)) {
    fab.classList.remove('bump'); void fab.offsetWidth; fab.classList.add('bump');
  }
  updateCartBadge._last = count;
}

function cartSubtotal(){
  return state.cart.reduce((s,c) => s + (c.price + (c.addon_extra||0)) * c.qty, 0);
}

function renderCart(){
  const sheet = document.getElementById('cartSheet');
  if (state.cart.length === 0) {
    sheet.innerHTML = `<div class="sheet-handle"></div><div class="empty-state">Корзина пуста</div>`;
    return;
  }
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="font-display" style="font-size:19px;font-weight:700;margin-bottom:10px;">Корзина</div>
    <div id="cartItemsList" style="display:flex;flex-direction:column;gap:10px;"></div>
    <div style="display:flex;justify-content:space-between;margin-top:16px;font-weight:600;">
      <span>Сумма блюд</span><span>${cartSubtotal().toLocaleString('ru-RU')} VND</span>
    </div>
    <button class="primary-btn" id="toCheckoutBtn">${ICONS.cartAdd}Оформить заказ</button>
  `;
  const list = sheet.querySelector('#cartItemsList');
  state.cart.forEach((c, idx) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;';
    row.innerHTML = `
      <img src="${c.image_url}" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;">${c.name}${c.addon ? ' · ' + c.addon : ''}</div>
        <div style="font-size:12px;color:var(--ink-soft);">${((c.price + (c.addon_extra||0))).toLocaleString('ru-RU')} VND</div>
      </div>
      <div class="qty-pill">
        <button data-dec="${idx}">${ICONS.minus}</button>
        <span>${c.qty}</span>
        <button data-inc="${idx}">${ICONS.plus}</button>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.dec);
    state.cart[i].qty -= 1;
    if (state.cart[i].qty <= 0) state.cart.splice(i,1);
    csSet(CS_KEY_CART, state.cart); updateCartBadge(); renderCart();
  }));
  list.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.inc);
    state.cart[i].qty += 1;
    csSet(CS_KEY_CART, state.cart); updateCartBadge(); renderCart();
  }));
  sheet.querySelector('#toCheckoutBtn').addEventListener('click', () => {
    try {
      closeOverlay('cartOverlay');
      openCheckout();
    } catch(e) {
      console.error('Ошибка при открытии оформления заказа:', e);
      showToast('Ошибка: ' + e.message);
    }
  });
}

/* Draggable floating cart button */
(function setupDrag(){
  const fab = document.getElementById('cartFab');
  let startX, startY, origX, origY, dragging = false, moved = false;
  fab.style.right = '18px';
  fab.style.bottom = '90px';

  function pointerDown(e){
    dragging = true; moved = false;
    const rect = fab.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    fab.style.left = origX + 'px'; fab.style.top = origY + 'px';
    fab.style.right = 'auto'; fab.style.bottom = 'auto';
  }
  function pointerMove(e){
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    let newX = origX + dx, newY = origY + dy;
    newX = Math.max(6, Math.min(window.innerWidth - 64, newX));
    newY = Math.max(6, Math.min(window.innerHeight - 64, newY));
    fab.style.left = newX + 'px'; fab.style.top = newY + 'px';
  }
  function pointerUp(){
    if (!dragging) return; // only act if a drag actually started on the fab itself
    dragging = false;
    if (!moved) { renderCart(); document.getElementById('cartOverlay').classList.add('open'); }
  }
  fab.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  fab.addEventListener('touchstart', pointerDown, {passive:true});
  window.addEventListener('touchmove', pointerMove, {passive:true});
  window.addEventListener('touchend', pointerUp);
})();

/* =========================================================
   CHECKOUT
========================================================= */
function haversine(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function deliveryFeeForDistance(km){
  const tier = DELIVERY_TIERS.find(t => km <= t.upTo);
  return tier ? tier.fee : DELIVERY_TIERS[DELIVERY_TIERS.length-1].fee;
}

function openCheckout(){
  const overlay = document.getElementById('checkoutOverlay');
  const sheet = document.getElementById('checkoutSheet');
  const subtotal = cartSubtotal();

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="font-display" style="font-size:19px;font-weight:700;">Оформление заказа</div>

    <label class="field-label">Telegram</label>
    <input id="fUsername" value="${tgUser ? '@' + (tgUser.username || tgUser.first_name) : ''}" readonly>

    <label class="field-label">Номер телефона</label>
    <input id="fPhone" type="tel" placeholder="+84 ...">

    <label class="field-label">Адрес доставки</label>
    <textarea id="fAddress" rows="2" placeholder="Улица, дом, ориентир"></textarea>

    <label class="field-label">Геопозиция</label>
    <div style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-soft);background:var(--surface);border-radius:10px;padding:9px 10px;margin-bottom:8px;">
      <span style="flex-shrink:0;width:15px;height:15px;color:var(--accent);margin-top:1px;">${ICONS.warning}</span>
      <span>При нажатии кнопки ниже Telegram спросит разрешение на доступ к геолокации — нажмите «Разрешить» / «Allow», иначе рассчитать доставку и оформить заказ не получится.</span>
    </div>
    <button type="button" class="secondary-btn" id="geoBtn">${ICONS.pin}Отправить мою геопозицию</button>
    <div id="geoStatus" style="font-size:12px;color:var(--ink-soft);margin-top:6px;"></div>

    <label class="field-label">Комментарий к заказу</label>
    <textarea id="fComment" rows="2" placeholder="Например: без острого, позвонить заранее"></textarea>

    <div style="margin-top:16px;padding:12px;background:#fff;border-radius:12px;border:1px solid var(--line);">
      <div style="display:flex;justify-content:space-between;font-size:13px;"><span>Сумма блюд</span><span>${subtotal.toLocaleString('ru-RU')} VND</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px;"><span>Доставка</span><span id="feeLine">—</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;"><span>Итого</span><span id="totalLine">${subtotal.toLocaleString('ru-RU')} VND</span></div>
    </div>

    <button class="primary-btn" id="submitOrderBtn" disabled>Укажите адрес и геопозицию</button>
  `;

  let deliveryFee = null;
  let point = null;

  function recompute(){
    const total = subtotal + (deliveryFee || 0);
    sheet.querySelector('#totalLine').textContent = total.toLocaleString('ru-RU') + ' VND';
    const btn = sheet.querySelector('#submitOrderBtn');
    const addr = sheet.querySelector('#fAddress').value.trim();
    const phone = sheet.querySelector('#fPhone').value.trim();
    const phoneOk = /^\+?[0-9\s-]{8,15}$/.test(phone);
    if (point && addr && phoneOk) {
      btn.disabled = false; btn.textContent = 'Заказать';
    } else {
      btn.disabled = true;
      btn.textContent = !phoneOk ? 'Укажите корректный телефон' : (!point ? 'Отправьте геопозицию' : 'Укажите адрес');
    }
  }

  sheet.querySelector('#fAddress').addEventListener('input', recompute);
  sheet.querySelector('#fPhone').addEventListener('input', recompute);

  sheet.querySelector('#geoBtn').addEventListener('click', () => {
    const status = sheet.querySelector('#geoStatus');
    function statusHtml(icon, color, text){
      return `<span style="display:flex;gap:6px;align-items:flex-start;"><span style="flex-shrink:0;width:13px;height:13px;color:${color};margin-top:1px;">${icon}</span><span>${text}</span></span>`;
    }
    function applyPoint(lat, lng){
      point = { lat, lng };
      state.deliveryPoint = point;
      const km = (state.restaurant.lat && state.restaurant.lng)
        ? haversine(state.restaurant.lat, state.restaurant.lng, lat, lng)
        : 0;
      deliveryFee = deliveryFeeForDistance(km);
      sheet.querySelector('#feeLine').textContent = deliveryFee.toLocaleString('ru-RU') + ' VND';
      status.innerHTML = statusHtml(ICONS.pin, 'var(--accent)', `Геопозиция получена (~${km.toFixed(1)} км от кухни). Ссылка: maps.google.com/?q=${lat.toFixed(5)},${lng.toFixed(5)}`);
      recompute();
    }

    const locationManagerOk = (() => {
      try { return !!(tg && tg.LocationManager && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')); }
      catch(e){ return false; }
    })();

    if (locationManagerOk) {
      try {
        tg.LocationManager.init(() => {
          tg.LocationManager.getLocation((loc) => {
            if (loc) {
              applyPoint(loc.latitude, loc.longitude);
            } else {
              status.innerHTML = statusHtml(ICONS.errorCircle, '#C0392B',
                'Доступ к геопозиции не разрешён. Чтобы оформить заказ, нужно разрешить доступ: ' +
                'откройте настройки Telegram → Конфиденциальность → или переоткройте это приложение и нажмите «Разрешить», когда появится запрос. ' +
                'Либо укажите точный адрес в поле выше и напишите координаты (можно скопировать из Google Maps) в комментарии к заказу.');
            }
          });
        });
      } catch(e) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            pos => applyPoint(pos.coords.latitude, pos.coords.longitude),
            () => { status.innerHTML = statusHtml(ICONS.errorCircle, '#C0392B', 'Доступ к геолокации запрещён в браузере. Разрешите его в настройках сайта или укажите координаты в комментарии.'); }
          );
        } else {
          status.textContent = 'Геолокация недоступна на этом устройстве. Укажите точный адрес и, если можете, координаты в комментарии.';
        }
      }
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => applyPoint(pos.coords.latitude, pos.coords.longitude),
        () => { status.innerHTML = statusHtml(ICONS.errorCircle, '#C0392B', 'Доступ к геолокации запрещён. Разрешите его в настройках браузера/Telegram или укажите координаты в комментарии.'); }
      );
    } else {
      status.textContent = 'Геолокация недоступна на этом устройстве.';
    }
  });

  sheet.querySelector('#submitOrderBtn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = 'Отправка...';

    // Final stock re-check right before sending the order
    const ids = state.cart.map(c => c.id).join(',');
    try {
      const stockRes = await apiGet('checkStock', { ids });
      if (stockRes.ok) {
        const shortages = state.cart.filter(c => (stockRes.data[c.id] ?? 0) < c.qty);
        if (shortages.length) {
          alert('К сожалению, часть блюд уже раскупили: ' + shortages.map(s => s.name).join(', ') + '. Обновите корзину.');
          btn.disabled = false; btn.textContent = 'Заказать';
          return;
        }
      }
    } catch(err){ console.error(err); }

    const payload = {
      telegram_user_id: tgUser ? tgUser.id : '',
      telegram_username: tgUser ? tgUser.username : '',
      phone: sheet.querySelector('#fPhone').value.trim(),
      address: sheet.querySelector('#fAddress').value.trim(),
      lat: point ? point.lat : '',
      lng: point ? point.lng : '',
      items: state.cart,
      subtotal, delivery_fee: deliveryFee || 0, total: subtotal + (deliveryFee || 0),
      comment: sheet.querySelector('#fComment').value.trim()
    };

    try {
      const res = await apiPost('createOrder', payload);
      if (res.ok) {
        state.cart = [];
        csSet(CS_KEY_CART, state.cart);
        updateCartBadge();
        closeOverlay('checkoutOverlay');
        if (tg) tg.showAlert('Ваш заказ находится в обработке, с вами свяжется администратор.');
        else alert('Ваш заказ находится в обработке, с вами свяжется администратор.');
      } else if (res.error === 'insufficient_stock') {
        alert('Не хватает на складе: ' + res.details.map(d => d.name).join(', '));
        btn.disabled = false; btn.textContent = 'Заказать';
      } else {
        alert('Ошибка отправки заказа. Попробуйте ещё раз.');
        btn.disabled = false; btn.textContent = 'Заказать';
      }
    } catch(err){
      console.error(err);
      alert('Ошибка сети. Проверьте соединение и попробуйте снова.');
      btn.disabled = false; btn.textContent = 'Заказать';
    }
  });

  overlay.classList.add('open');
}

document.getElementById('cartFab').addEventListener('dblclick', () => {}); // no-op, drag handles open

/* =========================================================
   TOAST
========================================================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

init();
</script>
